spring.application.name=FitLog

# PostgreSQL - domyślnie baza z Dockera (Infrastruktura/docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitlog}
spring.datasource.username=${DB_USERNAME:fitlog}
spring.datasource.password=${DB_PASSWORD:fitlog}

spring.jpa.hibernate.ddl-auto=update
