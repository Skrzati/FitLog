name: fitlog

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitlog}
      POSTGRES_USER: ${POSTGRES_USER:-fitlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitlog}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../Backend/FitLog
      dockerfile: ../../Infrastruktura/backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fitlog}
      DB_USERNAME: ${POSTGRES_USER:-fitlog}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fitlog}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../Frontend
      dockerfile: ../Infrastruktura/frontend/Dockerfile
      additional_contexts:
        infra: .
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
